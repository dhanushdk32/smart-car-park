<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Admin - SmartPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/admin.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="admin-body">

    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <!-- Reusable sidebar structure -->
        <div class="px-4 mb-4">
            <h4 class="fw-bold text-primary m-0"><i class="bi bi-p-square-fill me-2"></i>SmartPark</h4>
            <span class="text-muted small fw-medium">Admin Portal</span>
        </div>
        <div class="list-group list-group-flush border-none">
            <a href="dashboard.html" class="list-group-item list-group-item-action admin-link border-0"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <div class="px-4 mt-3 mb-1 text-muted small fw-bold text-uppercase">Parking Management</div>
            <a href="areas.html" class="list-group-item list-group-item-action admin-link border-0"><i class="bi bi-geo-alt me-2"></i> Parking Areas</a>
            <a href="slots.html" class="list-group-item list-group-item-action admin-link border-0"><i class="bi bi-grid-3x3 me-2"></i> Parking Slots</a>
            <div class="px-4 mt-3 mb-1 text-muted small fw-bold text-uppercase">Operations</div>
            <a href="bookings.html" class="list-group-item list-group-item-action admin-link border-0"><i class="bi bi-ticket-perforated me-2"></i> Bookings</a>
            <a href="users.html" class="list-group-item list-group-item-action admin-link border-0"><i class="bi bi-people me-2"></i> Users</a>
            <a href="payments.html" class="list-group-item list-group-item-action admin-link border-0"><i class="bi bi-credit-card me-2"></i> Payments</a>
            <div class="px-4 mt-3 mb-1 text-muted small fw-bold text-uppercase">Analytics & ML</div>
            <a href="analytics.html" class="list-group-item list-group-item-action admin-link border-0"><i class="bi bi-graph-up me-2"></i> Occupancy Analytics</a>
            <a href="predictions.html" class="list-group-item list-group-item-action admin-link border-0"><i class="bi bi-cpu me-2"></i> ML Predictions</a>
        </div>
    </aside>

    <main class="admin-main pb-5">
        <nav class="admin-navbar d-flex justify-content-between align-items-center mb-4">
            <button class="btn btn-light d-md-none" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
            <h5 class="fw-bold m-0 d-none d-md-block">Occupancy Analytics</h5>
            <div class="dropdown">
                <button class="btn btn-light dropdown-toggle border-0" type="button" data-bs-toggle="dropdown">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff" class="rounded-circle me-2" width="32" height="32" alt="Admin">
                    <span class="fw-medium">Super Admin</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
                    <li><a class="dropdown-item text-danger" href="#" onclick="AppAdmin.logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                </ul>
            </div>
        </nav>

        <div class="container-fluid">
            <!-- Filter -->
            <div class="card shadow-sm border-0 rounded-4 mb-4">
                <div class="card-body p-3">
                    <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary btn-sm px-3">Daily</button>
                            <button class="btn btn-outline-secondary btn-sm px-3">Weekly</button>
                            <button class="btn btn-outline-secondary btn-sm px-3">Monthly</button>
                        </div>
                        <div class="d-flex gap-2">
                            <input type="date" class="form-control form-control-sm">
                            <button class="btn btn-outline-primary btn-sm"><i class="bi bi-download"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="row g-4 mb-4">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 rounded-4 h-100">
                        <div class="card-header bg-white pt-4 px-4 border-bottom-0">
                            <h6 class="fw-bold m-0">Hourly Occupancy Trend (Today)</h6>
                        </div>
                        <div class="card-body p-4">
                            <div class="chart-container">
                                <canvas id="occupancyChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0 rounded-4 h-100">
                        <div class="card-header bg-white pt-4 px-4 border-bottom-0">
                            <h6 class="fw-bold m-0">Area Distribution</h6>
                        </div>
                        <div class="card-body p-4">
                            <div class="chart-container">
                                <canvas id="areaComparisonChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0 rounded-4 h-100">
                        <div class="card-header bg-white pt-4 px-4 border-bottom-0">
                            <h6 class="fw-bold m-0">Weekly Average Occupancy</h6>
                        </div>
                        <div class="card-body p-4">
                            <div class="chart-container">
                                <canvas id="weeklyOccupancyChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card shadow-sm border-0 rounded-4 h-100">
                        <div class="card-header bg-white pt-4 px-4 border-bottom-0">
                            <h6 class="fw-bold m-0">Revenue Trend (Last 7 Days)</h6>
                        </div>
                        <div class="card-body p-4">
                            <div class="chart-container">
                                <canvas id="revenueChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/charts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.AppCharts) {
                window.AppCharts.initAnalyticsCharts();
            }
        });
    </script>
</body>
</html>
