<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SmartPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="text-center mb-4 text-white">
                    <i class="bi bi-p-square-fill display-4 text-primary mb-3"></i>
                    <h2 class="fw-bold">SmartPark Admin</h2>
                    <p class="opacity-75">Management Control Panel</p>
                </div>

                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <form id="adminLoginForm" onsubmit="event.preventDefault(); window.AppAdmin.handleLogin();">
                            <div class="mb-3">
                                <label class="form-label fw-medium text-secondary small">Admin Username / Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control border-start-0 bg-light" id="adminEmail" placeholder="admin@smartpark.com" required value="admin">
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-medium text-secondary small mb-1">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control border-start-0 bg-light" id="adminPassword" placeholder="Enter password" required value="admin123">
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">Login to Dashboard</button>
                        </form>
                    </div>
                </div>
                
                <div class="text-center mt-4">
                    <a href="../index.html" class="text-white-50 text-decoration-none small"><i class="bi bi-arrow-left me-1"></i> Back to Main Site</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
