<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SmartPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/user.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="bi bi-p-square-fill me-2"></i>SmartPark
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="parking.html">Parking</a></li>
                    <li class="nav-item"><a class="nav-link" href="bookings.html">My Bookings</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <div class="dropdown">
                        <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i> My Account
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="dashboard.html">Dashboard</a></li>
                            <li><a class="dropdown-item active" href="profile.html">Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="App.logout()">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-4">
            <!-- Sidebar Profile -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 text-center p-4 rounded-4">
                    <div class="mb-4">
                        <div class="d-inline-flex justify-content-center align-items-center bg-primary text-white rounded-circle fs-1 fw-bold mb-3" style="width: 100px; height: 100px;">
                            JD
                        </div>
                        <h4 class="fw-bold mb-1">John Doe</h4>
                        <p class="text-muted mb-3">john@example.com</p>
                        <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill">Active Member</span>
                    </div>
                    <div class="list-group list-group-flush text-start border-top pt-3">
                        <a href="#personal" class="list-group-item list-group-item-action border-0 fw-medium active text-primary bg-transparent"><i class="bi bi-person me-2"></i>Personal Info</a>
                        <a href="#security" class="list-group-item list-group-item-action border-0 fw-medium text-muted"><i class="bi bi-shield-lock me-2"></i>Security</a>
                        <a href="bookings.html" class="list-group-item list-group-item-action border-0 fw-medium text-muted"><i class="bi bi-ticket-perforated me-2"></i>My Bookings</a>
                    </div>
                </div>
            </div>

            <!-- Profile Details -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-4 mb-4">
                    <div class="card-header bg-white pt-4 pb-3 border-bottom px-4">
                        <h5 class="fw-bold mb-0">Personal Information</h5>
                    </div>
                    <div class="card-body p-4">
                        <form onsubmit="event.preventDefault(); App.showToast('Success', 'Profile updated successfully', 'success');">
                            <div class="row g-4 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-medium">Full Name</label>
                                    <input type="text" class="form-control" value="John Doe">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-medium">Email Address</label>
                                    <input type="email" class="form-control" value="john@example.com" readonly>
                                    <small class="text-muted" style="font-size: 0.7rem;">Email cannot be changed</small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-medium">Mobile Number</label>
                                    <input type="tel" class="form-control" value="9876543210">
                                </div>
                            </div>
                            
                            <h6 class="fw-bold mb-3 mt-5">Vehicle Details</h6>
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-medium">Car Registration Number</label>
                                    <input type="text" class="form-control text-uppercase" value="KA-01-AB-1234">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-medium">Vehicle Type</label>
                                    <select class="form-select">
                                        <option value="Car" selected>Car</option>
                                        <option value="SUV">SUV</option>
                                        <option value="EV">EV</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>

                            <div class="text-end mt-4 pt-3 border-top">
                                <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Password Change -->
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-header bg-white pt-4 pb-3 border-bottom px-4">
                        <h5 class="fw-bold mb-0">Change Password</h5>
                    </div>
                    <div class="card-body p-4">
                        <form onsubmit="event.preventDefault(); App.showToast('Success', 'Password changed successfully', 'success'); this.reset();">
                            <div class="row g-4">
                                <div class="col-md-12">
                                    <label class="form-label text-muted small fw-medium">Current Password</label>
                                    <input type="password" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-medium">New Password</label>
                                    <input type="password" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-medium">Confirm New Password</label>
                                    <input type="password" class="form-control" required>
                                </div>
                            </div>
                            <div class="text-end mt-4 pt-3 border-top">
                                <button type="submit" class="btn btn-outline-primary px-4">Update Password</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userCar = localStorage.getItem('userCar');
            if (userCar) {
                const carInput = document.querySelector('input[value="KA-01-AB-1234"]');
                if (carInput) carInput.value = userCar;
            }
        });
    </script>
</body>
</html>
