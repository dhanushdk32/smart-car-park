<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Areas - SmartPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/user.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="bi bi-p-square-fill me-2"></i>SmartPark
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="parking.html">Parking</a></li>
                    <li class="nav-item"><a class="nav-link" href="bookings.html">My Bookings</a></li>
                </ul>
                <div class="d-flex" id="nav-login-links">
                    <a href="login.html" class="btn btn-outline-primary me-2">Login</a>
                    <a href="register.html" class="btn btn-primary">Register</a>
                </div>
                <div class="d-none align-items-center" id="nav-user-links">
                    <div class="dropdown">
                        <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i> My Account
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="dashboard.html">Dashboard</a></li>
                            <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="App.logout()">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="bg-primary text-white py-5 mb-5">
        <div class="container text-center">
            <h1 class="fw-bold mb-2">Parking Areas</h1>
            <p class="lead opacity-75 mb-0">Find a parking location that works for you.</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row mb-4 bg-white p-3 rounded-3 shadow-sm align-items-center g-3">
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" class="form-control border-start-0 bg-light" id="searchInput" placeholder="Search parking area..." oninput="filterAreas()">
                </div>
            </div>
            <div class="col-md-3">
                <select class="form-select bg-light" id="locationFilter" onchange="filterAreas()">
                    <option value="">All Locations</option>
                    <option value="Downtown">Downtown</option>
                    <option value="West End">West End</option>
                    <option value="East Side">East Side</option>
                </select>
            </div>
            <div class="col-md-4">
                <select class="form-select bg-light" id="availabilityFilter" onchange="filterAreas()">
                    <option value="">All Statuses</option>
                    <option value="available">Available First</option>
                    <option value="high">High Occupancy</option>
                </select>
            </div>
        </div>

        <div class="row g-4" id="parking-list">
            <!-- Populated by JS -->
        </div>
    </div>

    <footer class="bg-white py-4 border-top">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2026 SmartPark Management System. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        let areasData = [];

        function renderAreas(areas) {
            const container = document.getElementById('parking-list');
            if (areas.length === 0) {
                container.innerHTML = `<div class="col-12 text-center py-5 text-muted">No parking areas found matching your criteria.</div>`;
                return;
            }
            
            container.innerHTML = areas.map(area => {
                const occupancyRate = (area.occupied / area.totalSlots) * 100;
                let badgeClass = 'bg-success';
                if(occupancyRate > 80) badgeClass = 'bg-danger';
                else if(occupancyRate > 50) badgeClass = 'bg-warning';

                return `
                    <div class="col-lg-6">
                        <div class="card h-100 shadow-sm border-0 step-card">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <div>
                                        <h4 class="fw-bold mb-1">${area.name}</h4>
                                        <p class="text-muted mb-0"><i class="bi bi-geo-alt me-1"></i>${area.location}</p>
                                    </div>
                                    <span class="badge ${badgeClass} fs-6">${area.available} Available</span>
                                </div>
                                
                                <div class="progress mb-4" style="height: 10px;">
                                    <div class="progress-bar ${badgeClass}" style="width: ${occupancyRate}%"></div>
                                </div>
                                
                                <div class="row text-center mb-4 g-2">
                                    <div class="col-4">
                                        <div class="bg-light rounded p-2 border">
                                            <div class="fw-bold fs-5">${area.available}</div>
                                            <div class="small text-muted">Available</div>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="bg-light rounded p-2 border">
                                            <div class="fw-bold fs-5">${area.occupied}</div>
                                            <div class="small text-muted">Occupied</div>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="bg-light rounded p-2 border">
                                            <div class="fw-bold fs-5">${area.totalSlots}</div>
                                            <div class="small text-muted">Total Slots</div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="d-flex justify-content-between align-items-center bg-light p-3 rounded">
                                    <div>
                                        <div class="text-muted small">Rate per hour</div>
                                        <div class="fw-bold text-primary fs-4">₹${area.pricePerHour}</div>
                                    </div>
                                    <a href="slots.html?area=${area.id}" class="btn btn-primary px-4 py-2">Select Slot</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterAreas() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const location = document.getElementById('locationFilter').value;
            const availability = document.getElementById('availabilityFilter').value;

            let filtered = areasData.filter(area => {
                const matchesSearch = area.name.toLowerCase().includes(searchTerm) || area.location.toLowerCase().includes(searchTerm);
                const matchesLocation = location ? area.location === location : true;
                return matchesSearch && matchesLocation;
            });

            if (availability === 'available') {
                filtered.sort((a, b) => b.available - a.available);
            } else if (availability === 'high') {
                filtered.sort((a, b) => (b.occupied / b.totalSlots) - (a.occupied / a.totalSlots));
            }

            renderAreas(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.mockData) {
                areasData = window.mockData.parkingAreas;
                renderAreas(areasData);
            }
        });
    </script>
</body>
</html>
