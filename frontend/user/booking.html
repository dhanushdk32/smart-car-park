<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Details - SmartPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/user.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white sticky-top border-bottom">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="bi bi-p-square-fill me-2"></i>SmartPark
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="parking.html">Parking</a></li>
                    <li class="nav-item"><a class="nav-link" href="bookings.html">My Bookings</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center g-4">
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 mb-4 rounded-4">
                    <div class="card-body p-4 p-md-5">
        <form id="bookingDetailsForm">
            <div class="row justify-content-center g-4">
                <div class="col-lg-7">
                    <div class="card shadow-sm border-0 mb-4 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <h3 class="fw-bold mb-4">Complete Your Booking</h3>
                            
                            <h5 class="fw-bold mb-3 border-bottom pb-2">Vehicle Details</h5>
                            <div class="mb-4">
                                <label class="form-label fw-medium small text-secondary">Car Registration Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-car-front"></i></span>
                                    <input type="text" class="form-control border-start-0 text-uppercase" id="carNumber" placeholder="KA-01-AB-1234" required>
                                </div>
                            </div>

                            <h5 class="fw-bold mb-3 border-bottom pb-2 mt-5">Schedule</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-medium small text-secondary">Date</label>
                                    <input type="date" class="form-control" id="bookingDate" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-medium small text-secondary">Start Time</label>
                                    <input type="time" class="form-control" id="bookingTime" value="10:00" required>
                                </div>
                                <div class="col-12 mt-3">
                                    <label class="form-label fw-medium small text-secondary">Duration</label>
                                    <select class="form-select" id="bookingDuration" required>
                                        <option value="1">1 Hour</option>
                                        <option value="2">2 Hours</option>
                                        <option value="3" selected>3 Hours</option>
                                        <option value="4">4 Hours</option>
                                        <option value="5">5 Hours</option>
                                        <option value="6">6 Hours</option>
                                        <option value="12">12 Hours (Half Day)</option>
                                        <option value="24">24 Hours (Full Day)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Summary Sidebar -->
                <div class="col-lg-5">
                    <div class="card shadow-sm border-0 sticky-top" style="top: 100px;">
                        <div class="card-header bg-white pt-4 pb-3 border-bottom-0">
                            <h5 class="fw-bold mb-0">Booking Summary</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-3">
                                <span class="text-muted">Parking Area</span>
                                <span class="fw-medium text-end" id="displayArea">--</span>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <span class="text-muted">Slot Selected</span>
                                <span class="fw-medium" id="displaySlot">--</span>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <span class="text-muted">Date</span>
                                <span class="fw-medium" id="displayDate">--</span>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <span class="text-muted">Start Time</span>
                                <span class="fw-medium" id="displayTime">--</span>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <span class="text-muted">Duration</span>
                                <span class="fw-medium" id="displayDuration">--</span>
                            </div>
                            <div class="d-flex justify-content-between mb-4 pb-3 border-bottom">
                                <span class="text-muted">Rate</span>
                                <span class="fw-medium"><span id="displayRate">--</span></span>
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <span class="fs-5 fw-bold text-dark">Total Amount</span>
                                <span class="fs-3 fw-bold text-primary" id="displayTotal">--</span>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-sm" id="btnSubmitBooking" form="bookingDetailsForm">
                                Confirm Booking
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/booking.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.AppBooking) {
                window.AppBooking.initBookingForm();
                const form = document.getElementById('bookingDetailsForm');
                form.addEventListener('submit', window.AppBooking.processBooking);
            }
        });
    </script>
</body>
</html>
