<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - SmartPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/user.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Simplified Navbar for checkout flow -->
    <nav class="navbar bg-white py-3 border-bottom mb-5">
        <div class="container justify-content-center">
            <a class="navbar-brand m-0" href="../index.html">
                <i class="bi bi-p-square-fill me-2 text-primary"></i><span class="fw-bold">SmartPark Checkout</span>
            </a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center g-4">
            <!-- Payment Methods -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 rounded-4 mb-4">
                    <div class="card-body p-4 p-md-5">
                        <h4 class="fw-bold mb-4">Payment Method</h4>
                        
                        <div class="alert alert-info border-0 bg-info bg-opacity-10 d-flex align-items-center mb-4">
                            <i class="bi bi-info-circle-fill text-info fs-4 me-3"></i>
                            <small>This is a simulated payment gateway for Stage 1. No real transactions will be processed.</small>
                        </div>

                        <!-- Method selection -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <div class="card border border-primary bg-primary bg-opacity-10 cursor-pointer h-100" id="method-upi" onclick="AppPayment.selectMethod('method-upi')">
                                    <div class="card-body text-center p-3">
                                        <div class="form-check d-flex justify-content-center mb-2">
                                            <input class="form-check-input" type="radio" name="paymentMethod" checked>
                                        </div>
                                        <i class="bi bi-qr-code-scan fs-3 text-primary mb-2 d-block"></i>
                                        <span class="fw-medium small">UPI</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card border cursor-pointer h-100" id="method-card" onclick="AppPayment.selectMethod('method-card')">
                                    <div class="card-body text-center p-3">
                                        <div class="form-check d-flex justify-content-center mb-2">
                                            <input class="form-check-input" type="radio" name="paymentMethod">
                                        </div>
                                        <i class="bi bi-credit-card fs-3 text-secondary mb-2 d-block"></i>
                                        <span class="fw-medium small text-secondary">Card</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card border cursor-pointer h-100" id="method-net" onclick="AppPayment.selectMethod('method-net')">
                                    <div class="card-body text-center p-3">
                                        <div class="form-check d-flex justify-content-center mb-2">
                                            <input class="form-check-input" type="radio" name="paymentMethod">
                                        </div>
                                        <i class="bi bi-bank fs-3 text-secondary mb-2 d-block"></i>
                                        <span class="fw-medium small text-secondary">Net Banking</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Forms -->
                        <div id="form-upi">
                            <label class="form-label small fw-medium text-secondary">Enter UPI ID</label>
                            <input type="text" class="form-control" placeholder="user@upi" value="demo@ybl">
                            <div class="text-center mt-3 text-muted small">or scan QR with any UPI app</div>
                        </div>

                        <div id="form-card" class="d-none">
                            <div class="mb-3">
                                <label class="form-label small fw-medium text-secondary">Card Number</label>
                                <input type="text" class="form-control" placeholder="0000 0000 0000 0000">
                            </div>
                            <div class="row g-3">
                                <div class="col-6">
                                    <label class="form-label small fw-medium text-secondary">Expiry Date</label>
                                    <input type="text" class="form-control" placeholder="MM/YY">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-medium text-secondary">CVV</label>
                                    <input type="password" class="form-control" placeholder="***">
                                </div>
                            </div>
                        </div>

                        <div id="form-net" class="d-none">
                            <label class="form-label small fw-medium text-secondary">Select Bank</label>
                            <select class="form-select">
                                <option>HDFC Bank</option>
                                <option>ICICI Bank</option>
                                <option>SBI</option>
                                <option>Axis Bank</option>
                            </select>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Summary -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">Order Summary</h5>
                        
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted small">Parking Area</span>
                            <span class="fw-medium" id="pay-area">--</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted small">Slot Number</span>
                            <span class="fw-bold text-primary" id="pay-slot">--</span>
                        </div>
                        <div class="d-flex justify-content-between mb-4 pb-3 border-bottom">
                            <span class="text-muted small">Date & Time</span>
                            <span class="fw-medium text-end small" id="pay-datetime">--</span>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span class="text-muted fw-bold">Amount to Pay</span>
                            <span class="fs-3 fw-bold" id="pay-total">--</span>
                        </div>

                        <button type="button" id="btn-pay" class="btn btn-success w-100 py-3 fw-bold rounded-3 shadow-sm" onclick="AppPayment.processPayment()">
                            <span id="btn-pay-text">Pay Now</span>
                        </button>
                        <div class="text-center mt-3">
                            <i class="bi bi-shield-lock-fill text-success me-1"></i>
                            <small class="text-muted">100% Secure Payment Demo</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/payment.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.AppPayment) {
                window.AppPayment.initPaymentPage();
            }
        });
    </script>
</body>
</html>
