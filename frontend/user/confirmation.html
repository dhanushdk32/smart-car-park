<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed - SmartPark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/user.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar bg-white py-3 border-bottom">
        <div class="container justify-content-center">
            <a class="navbar-brand m-0" href="../index.html">
                <i class="bi bi-p-square-fill me-2 text-primary"></i><span class="fw-bold">SmartPark</span>
            </a>
        </div>
    </nav>

    <div class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm border-0 rounded-4 w-100" style="max-width: 600px;">
            <div class="card-body p-4 p-md-5 text-center">
                
                <div class="mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle" style="width: 80px; height: 80px;">
                        <i class="bi bi-check-lg" style="font-size: 3rem;"></i>
                    </div>
                </div>
                
                <h2 class="fw-bold mb-2">Payment Successful!</h2>
                <p class="text-muted mb-4">Your parking slot has been reserved successfully.</p>

                <div class="bg-light rounded p-4 text-start mb-4 border border-dashed">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                        <span class="text-muted small">Booking ID</span>
                        <span class="fw-bold text-dark font-monospace" id="conf-booking-id">--</span>
                    </div>
                    
                    <div class="row g-3">
                        <div class="col-6">
                            <span class="text-muted small d-block mb-1">Parking Area</span>
                            <span class="fw-medium" id="conf-area">--</span>
                        </div>
                        <div class="col-6">
                            <span class="text-muted small d-block mb-1">Slot Number</span>
                            <span class="badge bg-primary fs-6" id="conf-slot">--</span>
                        </div>
                        <div class="col-6 mt-3">
                            <span class="text-muted small d-block mb-1">Date</span>
                            <span class="fw-medium" id="conf-date">--</span>
                        </div>
                        <div class="col-6 mt-3">
                            <span class="text-muted small d-block mb-1">Time</span>
                            <span class="fw-medium" id="conf-time">--</span>
                        </div>
                        <div class="col-6 mt-3">
                            <span class="text-muted small d-block mb-1">Duration</span>
                            <span class="fw-medium" id="conf-duration">--</span>
                        </div>
                        <div class="col-12 mt-3 pt-3 border-top">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-muted small">Amount Paid</span>
                                <span class="fs-4 fw-bold text-success" id="conf-amount">--</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                    <a href="bookings.html" class="btn btn-outline-primary py-2 px-4">View My Bookings</a>
                    <a href="dashboard.html" class="btn btn-primary py-2 px-4">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/payment.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.AppPayment) {
                window.AppPayment.initConfirmationPage();
            }
        });
    </script>
</body>
</html>
