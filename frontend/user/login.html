<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartPark</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/user.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="bi bi-p-square-fill me-2"></i>SmartPark
            </a>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="main-content d-flex align-items-center" style="min-height: calc(100vh - 76px);">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5 col-xl-4">
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <h2 class="fw-bold mb-1">Welcome Back</h2>
                                <p class="text-muted small">Enter your details to manage your parking</p>
                            </div>
                            
                            <form id="loginForm" onsubmit="event.preventDefault(); window.AppUser.handleLogin();">
                                <div class="mb-3">
                                    <label class="form-label fw-medium text-secondary small">Car Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-car-front"></i></span>
                                        <input type="text" class="form-control border-start-0 ps-0 text-uppercase" id="carNumber" placeholder="e.g. KA-01-AB-1234" required>
                                    </div>
                                </div>
                                
                                <div class="mb-4">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <label class="form-label fw-medium text-secondary small mb-0">Password</label>
                                        <a href="#" class="text-decoration-none small text-primary">Forgot Password?</a>
                                    </div>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" placeholder="Enter your password" required>
                                        <span class="input-group-text bg-white border-start-0 cursor-pointer" onclick="window.AppUser.togglePasswordVisibility('password', this)"><i class="bi bi-eye text-muted"></i></span>
                                    </div>
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100 py-2 mb-4 rounded-3 fw-medium">Login</button>
                                
                                <div class="text-center">
                                    <span class="text-muted small">Don't have an account? </span>
                                    <a href="register.html" class="text-primary text-decoration-none fw-medium">Create Account</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/user.js"></script>
</body>
</html>
